name: CI

# GitHub — зеркало GitLab (ADR 0006 в my-ops): тесты и AppImage здесь второй
# контур, но собираются из тех же файлов. Тег ставится один раз — в GitLab,
# зеркало приносит его сюда, и по тегу v* появляется GitHub Release.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: |
          dotnet test tests/Rat6.Tests/Rat6.Tests.csproj -c Release \
            --logger "junit;LogFilePath=${GITHUB_WORKSPACE}/artifacts/test-results/junit.xml"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/junit.xml
          if-no-files-found: warn

  appimage:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install packaging dependencies
        run: ./packaging/appimage/install-deps-ubuntu.sh

      - name: Build AppImage
        env:
          RAW_VERSION: ${{ github.ref_name }}
        run: |
          APPIMAGE_VERSION="${RAW_VERSION#v}"
          export APPIMAGE_VERSION
          export OUTPUT_NAME="Rat6-${APPIMAGE_VERSION}-x86_64.AppImage"
          ./packaging/appimage/build-appimage.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rat6-x86_64.AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.AppImage
          generate_release_notes: true
